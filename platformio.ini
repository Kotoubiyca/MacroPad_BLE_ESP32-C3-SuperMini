[env:esp32-c3-devkitm-1]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200

build_unflags =
  -std=gnu++11

build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

lib_ldf_mode = deep+

lib_deps =
  h2zero/NimBLE-Arduino@^2.0.0
  hijelhub/HijelHID_BLEKeyboard